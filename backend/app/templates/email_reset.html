<!DOCTYPE html>
<html lang="it">
<head><meta charset="UTF-8"><title>Reset password</title></head>
<body style="font-family:system-ui,sans-serif;max-width:480px;margin:40px auto;color:#222">
  <h2 style="color:#1a1a2e">Reset della password</h2>
  <p>Abbiamo ricevuto una richiesta di reset della password per il tuo account.</p>
  <p style="margin:24px 0">
    <a href="{{ reset_url }}" style="background:#e94560;color:#fff;padding:10px 20px;border-radius:4px;text-decoration:none;font-weight:600">
      Reimposta password
    </a>
  </p>
  <p style="font-size:0.85em;color:#666">Il link scade tra 1 ora. Se non hai richiesto il reset, ignora questa email.</p>
  <p style="font-size:0.85em;color:#aaa">{{ reset_url }}</p>
</body>
</html>
